# Build, verify, and publish a release using OIDC Trusted Publishing; no API
# token is stored in GitHub. The tag decides where the build goes:
#   v0.1.0rc1 (release candidate) -> TestPyPI, through the "testpypi" environment
#   v0.1.0    (final release)     -> PyPI,     through the "pypi" environment
# Any other v* tag fails scripts/check_dist.py before anything is uploaded.
#
# One-time setup on the upstream repository before the first tag of each kind:
#   1. On test.pypi.org (for rc tags) and pypi.org (for final tags), add a
#      pending Trusted Publisher for project "vorflow": owner "rhugman",
#      repository "vorflow", workflow "release.yml", and environment
#      "testpypi" or "pypi" respectively.
#   2. In GitHub (Settings > Environments), create the "testpypi" and "pypi"
#      environments and add at least one required reviewer to each, so every
#      upload is approved by hand.
#
# The version is read from pyproject.toml; bump it there before tagging.
# scripts/check_dist.py fails the build if the tag and pyproject disagree.
#
# After a final release reaches PyPI, the github-release job creates the GitHub
# Release for the tag, with notes from the tag's CHANGELOG.md section
# (scripts/release_notes.py) and the wheel and sdist attached. A tag without a
# changelog section fails the build before anything is uploaded.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Gmsh system library
        run: sudo apt-get update && sudo apt-get install --yes libglu1-mesa
      - name: Install build and test tools
        # [dev] provides build, twine, and packaging (used by check_dist.py).
        run: python -m pip install -e ".[dev]"
      - name: Run Ruff
        run: ruff check src tests scripts
      - name: Run pytest
        run: pytest --cov=vorflow --cov-report=term-missing
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check package metadata rendering
        run: python -m twine check dist/*
      - name: Validate tag, metadata, and archive contents
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_dist.py dist --expected-tag "$RELEASE_TAG"
      - name: Write release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_notes.py "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"
      - name: Smoke-test the built wheel
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          export EXPECTED_VERSION="${RELEASE_TAG#v}"
          python -m venv "$RUNNER_TEMP/vorflow-smoke"
          "$RUNNER_TEMP/vorflow-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/vorflow-smoke/bin/python" -m pip check
          "$RUNNER_TEMP/vorflow-smoke/bin/python" -c "import os, vorflow; assert vorflow.__version__ == os.environ['EXPECTED_VERSION'], vorflow.__version__"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/vorflow-smoke/bin/python" "$GITHUB_WORKSPACE/examples/basic_usage.py"
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  publish-testpypi:
    needs: build
    if: contains(github.ref_name, 'rc')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/vorflow
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    # check_dist.py has already rejected every tag that is neither vX.Y.Z
    # nor vX.Y.ZrcN, so a tag without "rc" here is a final release.
    if: ${{ !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vorflow
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes/
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "vorflow ${RELEASE_TAG#v}"
          --notes-file notes/release-notes.md
          --verify-tag
          --latest
