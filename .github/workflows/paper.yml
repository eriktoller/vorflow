name: paper

# Builds the JOSS paper draft (paper/paper.md) with the Open Journals
# toolchain and uploads the PDF as an artifact.
on:
  push:
    paths: ["paper/**", ".github/workflows/paper.yml"]
  pull_request:
    paths: ["paper/**", ".github/workflows/paper.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper draft
    steps:
      - uses: actions/checkout@v7
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - name: Upload PDF
        uses: actions/upload-artifact@v7
        with:
          name: paper
          path: paper/paper.pdf
